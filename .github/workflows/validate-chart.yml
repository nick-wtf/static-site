name: Validate Helm Chart

on:
  pull_request: {}

jobs:
  validate:
    runs-on: nick-wtf-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Lint Chart
        run: helm lint .

      - name: Template Chart
        run: helm template . > rendered.yaml && [ -s rendered.yaml ]
